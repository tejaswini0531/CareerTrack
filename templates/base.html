
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CareerTrack{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <h2>CareerTrack</h2>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact</a>

            {% if session.get('user_id') %}

                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="register-btn">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}" class="register-btn">
                    Register
                </a>

            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Simple Footer -->
    <footer class="simple-footer">
        <p>
            &copy; 2026 CareerTrack. All Rights Reserved.
            | Designed to organize your career journey.
        </p>
    </footer>

</body>
</html>
